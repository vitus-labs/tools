version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    ignore:
      # TypeScript 7 is deferred deliberately; without this Dependabot
      # reproposes it every time a 7.x patch lands. Remove this entry when
      # the repo is ready to move off the 6.x line.
      - dependency-name: 'typescript'
        update-types:
          - version-update:semver-major
    groups:
      storybook:
        patterns:
          - "@storybook/*"
          - "storybook"
          - "storybook-addon-*"
          - "@chromatic-com/*"
          - "@vueless/*"
      rollup:
        patterns:
          - "rollup"
          - "@rollup/*"
          - "rollup-plugin-*"
      biome:
        patterns:
          - "@biomejs/*"
      types:
        patterns:
          - "@types/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
