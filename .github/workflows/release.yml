name: Release

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'release/**'

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Stable release (main only) ──────────────────────────────────
  stable:
    if: github.ref == 'refs/heads/main'
    name: Release
    runs-on: ubuntu-latest
    env:
      # Prefer a maintainer-owned token. The version PR that changesets opens
      # is authored by whoever owns this token, and GITHUB_TOKEN means
      # github-actions[bot] — which this repo's Actions approval policy
      # (`first_time_contributors`) treats as a first-time contributor, so its
      # CI runs land in `action_required` and every version PR stalls until a
      # maintainer clicks "Approve and run".
      #
      # Set the RELEASE_TOKEN secret to a fine-grained PAT with Contents:
      # read+write and Pull requests: read+write on this repo, and the version
      # PR is authored by a real account instead — no approval gate, and CI
      # triggers on it normally. See CONTRIBUTING.md > Publishing.
      #
      # Falls back to GITHUB_TOKEN only when the secret is UNSET. An expired
      # or revoked RELEASE_TOKEN is still a non-empty string, so it wins the
      # `||` and the job fails at checkout instead of falling back. That fails
      # loudly before anything is published; to recover, delete the secret or
      # replace the token. See CONTRIBUTING.md > Publishing.
      RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ env.RELEASE_TOKEN }}

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Build all packages
        run: bun run pkgs:build

      - name: Create Release PR or Publish
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          version-script: bun run version-packages
          publish-script: bun run release
          pr-title: 'chore: version packages'
          commit-message: 'chore: version packages'
          # v2 stopped reading GITHUB_TOKEN from the environment.
          github-token: ${{ env.RELEASE_TOKEN }}
          # v2 defaults to pushing release commits and tags through the
          # GitHub API. Keep the v1 git-CLI behaviour so this migration
          # changes input names only; switching push modes can be its own
          # change, verified against a real release.
          push-with-git-cli: true
        env:
          # Still required, and NOT redundant with `github-token` above: the
          # version script spawns `changeset version`, whose
          # @changesets/changelog-github reads process.env.GITHUB_TOKEN to
          # resolve PR and author links. The input authenticates the action;
          # this authenticates the child process.
          GITHUB_TOKEN: ${{ env.RELEASE_TOKEN }}

  # ── Prerelease (feature/release branches) ───────────────────────
  prerelease:
    if: github.ref != 'refs/heads/main'
    name: Publish Prerelease
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      - name: Build all packages
        run: bun run pkgs:build

      - name: Publish snapshot
        run: |
          bunx changeset version --snapshot alpha
          bunx changeset publish --tag next
